name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node:
    name: Testes de dominio + contraste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testes (node --test)
        run: npm test

      - name: Contraste WCAG AA
        run: npm run contraste

  database:
    name: pgTAP (supabase test db)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sobe stack local
        run: supabase db start

      - name: Testes pgTAP
        run: supabase test db

      - name: Auditoria de RLS
        run: bash scripts/audit-rls.sh
